// Due day 31 falls on the last day of shorter months (30th, 28th/29th in Feb)
function dueDateIn(dayOfMonth, year, month) {
  const last = new Date(year, month + 1, 0).getDate();
  return new Date(year, month, Math.min(dayOfMonth, last));
}

function nextDueDate(dayOfMonth) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const thisMonth = dueDateIn(dayOfMonth, today.getFullYear(), today.getMonth());
  return thisMonth >= today ? thisMonth : dueDateIn(dayOfMonth, today.getFullYear(), today.getMonth() + 1);
}

function getDaysUntilDue(dayOfMonth) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((nextDueDate(dayOfMonth) - today) / (1000 * 60 * 60 * 24));
}

// ─── Reminders ───────────────────────────────────────────────
// Cards + settings are mirrored into IndexedDB so the service worker (sw.js)
// can work out what's due and show the notification.
const SETTINGS_KEY = "cardremind-settings";
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const canNotify = "Notification" in window && "serviceWorker" in navigator;

function loadSettings() {
  try { return { enabled: false, daysBefore: 3, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; }
  catch { return { enabled: false, daysBefore: 3 }; }
}

function kvPut(entries) {
  return new Promise((resolve) => {
    if (!("indexedDB" in window)) return resolve();
    const r = indexedDB.open("cardremind-db", 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore("kv");
    r.onerror = () => resolve();
    r.onsuccess = e => {
      const tx = e.target.result.transaction("kv", "readwrite");
      Object.entries(entries).forEach(([k, v]) => tx.objectStore("kv").put(v, k));
      tx.oncomplete = tx.onerror = () => resolve();
    };
  });
}

async function postToSW(message) {
  if (!("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.ready;
  reg.active && reg.active.postMessage(message);
}

async function registerDailySync() {
  try {
    const reg = await navigator.serviceWorker.ready;
    if (!("periodicSync" in reg)) return;
    const status = await navigator.permissions.query({ name: "periodic-background-sync" });
    if (status.state === "granted") await reg.periodicSync.register("daily-reminder", { minInterval: 12 * 60 * 60 * 1000 });
  } catch {}
}

// Monthly calendar event with an alarm: works on any phone even when the app is closed
function downloadCalendarReminder(card, daysBefore) {
  const day = parseInt(card.dueDay) || 1;
  const start = nextDueDate(day);
  const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
  // Day 29–31: pick the last of those days that exists in each month
  const rule = day > 28
    ? `RRULE:FREQ=MONTHLY;BYMONTHDAY=${Array.from({ length: day - 27 }, (_, i) => 28 + i).join(",")};BYSETPOS=-1`
    : `RRULE:FREQ=MONTHLY;BYMONTHDAY=${day}`;
  const esc = s => String(s).replace(/[\\,;]/g, m => "\\" + m);
  const title = esc(`💳 ${card.name} payment due`);
  const desc = esc(card.minPayment ? `Minimum payment $${parseFloat(card.minPayment).toFixed(2)}` : "Credit card payment due");
  const alarm = (trigger, text) => ["BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${text}`, `TRIGGER:${trigger}`, "END:VALARM"];
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//CardRemind//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:cardremind-${card.id}@cardremind`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`,
    `DTSTART;VALUE=DATE:${ymd(start)}`,
    `DTEND;VALUE=DATE:${ymd(end)}`,
    rule,
    `SUMMARY:${title}`,
    `DESCRIPTION:${desc}`,
    // All-day events start at midnight: 9am N days before = midnight minus (N-1) days 15h
    ...alarm(daysBefore > 1 ? `-P${daysBefore - 1}DT15H` : "-PT15H", title),
    ...alarm("PT9H", title),
    "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `${card.name.replace(/[^\w-]+/g, "_") || "card"}-reminder.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

function getUrgency(days) {
  if (days <= 0) return { label: "OVERDUE", color: "#ff4d4d", bg: "rgba(255,77,77,0.15)" };
  if (days <= 3) return { label: "DUE SOON", color: "#ff9500", bg: "rgba(255,149,0,0.15)" };
  if (days <= 7) return { label: "THIS WEEK", color: "#ffd60a", bg: "rgba(255,214,10,0.12)" };
  return { label: "UPCOMING", color: "#30d158", bg: "rgba(48,209,88,0.1)" };
}

// ─── Main app ────────────────────────────────────────────────
function App() {
  const [auth, setAuth] = useState(null); // { username, pin }
  // Remembered on this device so reminders keep working without signing in each time
  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("cardremind-auth") || "null");
      if (saved && saved.username && saved.pin) handleLogin(saved.username, saved.pin);
    } catch {}
  }, []);
  const [cards, setCards] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({ name: "", last4: "", dueDay: "", balance: "", minPayment: "", colorIdx: 0 });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [settings, setSettings] = useState(loadSettings);
  const [permission, setPermission] = useState(canNotify ? Notification.permission : "unsupported");
  const [installPrompt, setInstallPrompt] = useState(null);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  useEffect(() => {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  }, [settings]);

  // Mirror cards for the service worker, then check what's due (once a day)
  useEffect(() => {
    if (!auth || loading) return;
    kvPut({ cards, settings }).then(() => {
      if (settings.enabled && permission === "granted") postToSW({ type: "CHECK_REMINDERS" });
    });
  }, [auth, cards, settings, permission, loading]);

  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === "visible" && settings.enabled && permission === "granted") postToSW({ type: "CHECK_REMINDERS" });
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [settings, permission]);

  async function enableNotifications() {
    if (!canNotify) return;
    const result = await Notification.requestPermission();
    setPermission(result);
    if (result === "granted") {
      setSettings(s => ({ ...s, enabled: true }));
      registerDailySync();
      postToSW({ type: "TEST_NOTIFICATION" });
    }
  }

  async function installApp() {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice.catch(() => {});
    setInstallPrompt(null);
  }

  // The stored identity key = username + pin, so a wrong PIN loads nothing
  const identity = auth ? `${auth.username}#${auth.pin}` : null;

  async function loadCards(id) {
    setLoading(true);
    setError("");
    try {
      const res = await fetch(`${API}?username=eq.${encodeURIComponent(id)}&order=due_day.asc`, { headers });
      if (!res.ok) throw new Error(`Load failed (${res.status})`);
      const rows = await res.json();
      setCards(rows.map(fromRow));
    } catch (e) {
      setError("Couldn't load your cards. Check your connection and try again.");
    }
    setLoading(false);
  }

  function handleLogin(username, pin) {
    const id = `${username}#${pin}`;
    setAuth({ username, pin });
    try { localStorage.setItem("cardremind-auth", JSON.stringify({ username, pin })); } catch {}
    loadCards(id);
  }

  function logout() {
    setAuth(null);
    setCards([]);
    try { localStorage.removeItem("cardremind-auth"); } catch {}
    kvPut({ cards: [] });
  }

  async function addCard(cardData) {
    setError("");
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { ...headers, "Prefer": "return=representation" },
        body: JSON.stringify(toRow(cardData, identity)),
      });
      if (!res.ok) throw new Error();
      const [row] = await res.json();
      setCards(prev => [...prev, fromRow(row)]);
    } catch {
      setError("Couldn't save the card. Try again.");
    }
  }

  async function updateCard(id, cardData) {
    setError("");
    const prev = cards;
    setCards(cards.map(c => c.id === id ? { ...c, ...cardData } : c)); // optimistic
    try {
      const res = await fetch(`${API}?id=eq.${id}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify(toRow(cardData, identity)),
      });
      if (!res.ok) throw new Error();
    } catch {
      setCards(prev);
      setError("Couldn't update the card. Try again.");
    }
  }

  async function deleteCard(id) {
    setError("");
    const prev = cards;
    setCards(cards.filter(c => c.id !== id)); // optimistic
    try {
      const res = await fetch(`${API}?id=eq.${id}`, { method: "DELETE", headers });
      if (!res.ok) throw new Error();
    } catch {
      setCards(prev);
      setError("Couldn't delete the card. Try again.");
    }
  }

  async function togglePaid(id) {
    const key = `${new Date().getFullYear()}-${new Date().getMonth()}`;
    const card = cards.find(c => c.id === id);
    if (!card) return;
    const paid = card.paidMonths || [];
    const nextPaid = paid.includes(key) ? paid.filter(k => k !== key) : [...paid, key];
    updateCard(id, { ...card, paidMonths: nextPaid });
  }

  function isPaidThisMonth(card) {
    const key = `${new Date().getFullYear()}-${new Date().getMonth()}`;
    return (card.paidMonths || []).includes(key);
  }

  function openAdd() {
    setForm({ name: "", last4: "", dueDay: "", balance: "", minPayment: "", colorIdx: 0 });
    setEditId(null);
    setStep(0);
    setShowForm(true);
  }

  function openEdit(card) {
    setForm({ name: card.name, last4: card.last4, dueDay: card.dueDay, balance: card.balance, minPayment: card.minPayment, colorIdx: card.colorIdx });
    setEditId(card.id);
    setStep(0);
    setShowForm(true);
  }

  function handleSubmit() {
    if (!form.name || !form.dueDay) return;
    if (editId) updateCard(editId, form);
    else addCard(form);
    setShowForm(false);
  }

  const sorted = [...cards].sort((a, b) => getDaysUntilDue(a.dueDay) - getDaysUntilDue(b.dueDay));
  const totalDue = cards.filter(c => !isPaidThisMonth(c)).reduce((s, c) => s + (parseFloat(c.minPayment) || 0), 0);

  const styles = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap');
      * { box-sizing: border-box; }
      body { margin: 0; }
      .card-item { transition: transform 0.2s, box-shadow 0.2s; }
      .card-item:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.5) !important; }
      .btn-primary { background: #e8ff47; color: #080b14; border: none; padding: 12px 24px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; }
      .btn-primary:hover { background: #fff; transform: translateY(-1px); }
      .btn-primary:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; }
      .btn-primary:disabled:hover { transform: none; }
      .btn-ghost { background: transparent; color: #e8ff47; border: 1px solid #e8ff47; padding: 8px 16px; font-family: 'Space Mono', monospace; font-size: 11px; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; }
      .btn-ghost:hover { background: rgba(232,255,71,0.1); }
      .btn-danger { background: transparent; color: #ff4d4d; border: 1px solid rgba(255,77,77,0.3); padding: 6px 12px; font-family: 'Space Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.15s; }
      .btn-danger:hover { background: rgba(255,77,77,0.1); border-color: #ff4d4d; }
      .input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 14px; font-family: 'Space Mono', monospace; font-size: 13px; outline: none; width: 100%; transition: border 0.15s; }
      .input:focus { border-color: #e8ff47; }
      .input::placeholder { color: rgba(255,255,255,0.3); }
      .paid-badge { background: rgba(48,209,88,0.15); color: #30d158; padding: 3px 10px; font-size: 10px; letter-spacing: 2px; border: 1px solid rgba(48,209,88,0.3); }
    `}</style>
  );

  if (!auth) return (<>{styles}<Login onLogin={handleLogin} /></>);

  return (
    <div style={{ minHeight: "100vh", background: "#080b14", fontFamily: "'Courier New', monospace", color: "#e8e8e8", padding: "0 0 60px" }}>
      {styles}

      <div style={{ background: "linear-gradient(135deg, #0d1117 0%, #161b27 100%)", borderBottom: "1px solid rgba(232,255,71,0.15)", padding: "28px 24px 24px" }}>
        <div style={{ maxWidth: 680, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 10, letterSpacing: 4, color: "#e8ff47", marginBottom: 6, opacity: 0.8 }}>
                ☁ SYNCED · {auth.username.toUpperCase()}
              </div>
              <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 28, fontWeight: 800, lineHeight: 1.1, color: "#fff" }}>
                Credit Card<br />Reminders
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <button className="btn-primary" onClick={openAdd}>+ ADD CARD</button>
              <button className="btn-ghost" style={{ borderColor: "rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.5)" }} onClick={logout}>SWITCH USER</button>
            </div>
          </div>

          {error && (
            <div style={{ marginTop: 16, background: "rgba(255,77,77,0.1)", border: "1px solid rgba(255,77,77,0.3)", padding: "10px 16px", fontSize: 12, color: "#ff8080" }}>
              ⚠ {error}
            </div>
          )}

          {!loading && cards.length > 0 && (
            <div style={{ display: "flex", gap: 24, marginTop: 20, flexWrap: "wrap" }}>
              <div style={{ background: "rgba(232,255,71,0.08)", border: "1px solid rgba(232,255,71,0.2)", padding: "12px 20px" }}>
                <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", letterSpacing: 2, marginBottom: 4 }}>CARDS TRACKED</div>
                <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 24, fontWeight: 800, color: "#e8ff47" }}>{cards.length}</div>
              </div>
              <div style={{ background: "rgba(255,77,77,0.08)", border: "1px solid rgba(255,77,77,0.2)", padding: "12px 20px" }}>
                <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", letterSpacing: 2, marginBottom: 4 }}>MIN. DUE THIS MONTH</div>
                <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 24, fontWeight: 800, color: "#ff6b6b" }}>
                  {totalDue > 0 ? `$${totalDue.toFixed(2)}` : "—"}
                </div>
              </div>
              <div style={{ background: "rgba(48,209,88,0.08)", border: "1px solid rgba(48,209,88,0.2)", padding: "12px 20px" }}>
                <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", letterSpacing: 2, marginBottom: 4 }}>PAID THIS MONTH</div>
                <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 24, fontWeight: 800, color: "#30d158" }}>
                  {cards.filter(isPaidThisMonth).length}/{cards.length}

              </div>
            </div>
          )}
          <div style={{ marginTop: 20, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", padding: "14px 18px", fontSize: 12, lineHeight: 1.6 }}>
            <div style={{ fontSize: 10, letterSpacing: 2, color: "rgba(255,255,255,0.5)", marginBottom: 8 }}>🔔 PAYMENT REMINDERS</div>

            {isIOS && !isStandalone ? (
              <div style={{ color: "rgba(255,255,255,0.75)" }}>

              </div>
            ) : permission === "unsupported" ? (
              <div style={{ color: "rgba(255,255,255,0.75)" }}>This browser can't show notifications. Use "Add to calendar" on each card instead.</div>
            ) : permission === "denied" ? (
              <div style={{ color: "#ff9500" }}>Notifications are blocked. Allow them for this app in your phone's Settings, then reopen it.</div>
            ) : settings.enabled && permission === "granted" ? (
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", color: "rgba(255,255,255,0.75)" }}>
                <span style={{ color: "#30d158" }}>On</span>
                <span>· remind me</span>
                <select className="input" style={{ width: "auto", padding: "4px 8px" }} value={settings.daysBefore}
                  onChange={e => setSettings(s => ({ ...s, daysBefore: parseInt(e.target.value) }))}>
                  {[1, 2, 3, 5, 7].map(n => <option key={n} value={n} style={{ color: "#000" }}>{n} day{n > 1 ? "s" : ""}</option>)}
                </select>
                <span>before</span>
                <button className="btn-ghost" style={{ padding: "4px 10px" }} onClick={() => postToSW({ type: "TEST_NOTIFICATION" })}>TEST</button>
                <button className="btn-ghost" style={{ padding: "4px 10px", borderColor: "rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.5)" }} onClick={() => setSettings(s => ({ ...s, enabled: false }))}>TURN OFF</button>
              </div>
            ) : (
              <button className="btn-primary" onClick={enableNotifications}>ENABLE NOTIFICATIONS</button>
            )}

            {installPrompt && (
              <button className="btn-ghost" style={{ marginTop: 10 }} onClick={installApp}>⬇ INSTALL APP</button>
            )}
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", marginTop: 8 }}>
              Notifications appear when you open the app (and about once a day on installed Android). For a reminder that always fires, use 📅 Add to calendar on each card.
            </div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 680, margin: "0 auto", padding: "24px 24px 0" }}>

        {loading && (
          <div style={{ textAlign: "center", padding: "60px 20px", color: "rgba(255,255,255,0.4)", fontSize: 13 }}>
            ☁ Loading your cards…
          </div>
        )}

        {!loading && cards.length === 0 && (
          <div style={{ textAlign: "center", padding: "60px 20px", border: "1px dashed rgba(255,255,255,0.1)" }}>
            <div style={{ fontSize: 40, marginBottom: 16 }}>💳</div>
            <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 20, fontWeight: 700, marginBottom: 8, color: "#fff" }}>No cards yet</div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.4)", marginBottom: 24 }}>Add your first card — it'll sync to the cloud automatically</div>
            <button className="btn-primary" onClick={openAdd}>+ ADD YOUR FIRST CARD</button>
          </div>
        )}

        {!loading && sorted.map((card) => {
          const days = getDaysUntilDue(card.dueDay);
          const urgency = getUrgency(days);
          const paid = isPaidThisMonth(card);
          const color = CARD_COLORS[card.colorIdx % CARD_COLORS.length];

          return (
            <div key={card.id} className="card-item" style={{ marginBottom: 16, boxShadow: "0 8px 24px rgba(0,0,0,0.3)" }}>
              <div style={{ background: `linear-gradient(135deg, ${color.bg} 0%, ${color.accent} 100%)`, padding: "20px 24px 16px", position: "relative", overflow: "hidden" }}>
                <div style={{ position: "absolute", top: -30, right: -30, width: 120, height: 120, borderRadius: "50%", background: "rgba(255,255,255,0.05)" }} />
                <div style={{ position: "absolute", bottom: -20, right: 20, width: 80, height: 80, borderRadius: "50%", background: "rgba(255,255,255,0.05)" }} />
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.6)", marginBottom: 4 }}>CREDIT CARD</div>
                    <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 18, fontWeight: 800, color: "#fff" }}>{card.name}</div>
                  </div>
                  <CardChip />
                </div>
                <div style={{ marginTop: 16, fontFamily: "'Space Mono', monospace", fontSize: 14, color: "rgba(255,255,255,0.8)", letterSpacing: 2 }}>
                  •••• •••• •••• {card.last4 || "••••"}
                </div>
              </div>

              <div style={{ background: "#111827", border: "1px solid rgba(255,255,255,0.07)", borderTop: "none", padding: "16px 24px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
                  <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
                    <div>
                      <div style={{ fontSize: 9, letterSpacing: 2, color: "rgba(255,255,255,0.4)", marginBottom: 3 }}>DUE DATE</div>
                      <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 16, fontWeight: 700, color: "#fff" }}>Day {card.dueDay}</div>
                    </div>
                    {card.minPayment && (
                      <div>
                        <div style={{ fontSize: 9, letterSpacing: 2, color: "rgba(255,255,255,0.4)", marginBottom: 3 }}>MIN. PAYMENT</div>
                        <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 16, fontWeight: 700, color: "#fff" }}>${parseFloat(card.minPayment).toFixed(2)}</div>
                      </div>
                    )}
                    {card.balance && (
                      <div>
                        <div style={{ fontSize: 9, letterSpacing: 2, color: "rgba(255,255,255,0.4)", marginBottom: 3 }}>BALANCE</div>
                        <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 16, fontWeight: 700, color: "#fff" }}>${parseFloat(card.balance).toFixed(2)}</div>
                      </div>
                    )}
                  </div>

                  <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 8 }}>
                    {paid ? (
                      <span className="paid-badge">✓ PAID</span>
                    ) : (
                      <span style={{ background: urgency.bg, color: urgency.color, padding: "3px 10px", fontSize: 10, letterSpacing: 2, border: `1px solid ${urgency.color}40` }}>
                        {days === 0 ? "TODAY" : days < 0 ? `${Math.abs(days)}D OVERDUE` : `${days}D — ${urgency.label}`}
                      </span>
                    )}
                  </div>
                </div>

                <div style={{ display: "flex", gap: 8, marginTop: 14, borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: 14, flexWrap: "wrap" }}>
                  <button
                    className="btn-ghost"
                    style={paid ? { borderColor: "rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.4)" } : {}}
                    onClick={() => togglePaid(card.id)}
                  >
                    {paid ? "↩ MARK UNPAID" : "✓ MARK PAID"}
                  </button>
                  <button className="btn-ghost" style={{ borderColor: "rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.5)" }} onClick={() => openEdit(card)}>
                    EDIT
                  </button>
                  <button className="btn-ghost" style={{ borderColor: "rgba(255,255,255,0.2)", color: "rgba(255,255,255,0.5)" }} onClick={() => downloadCalendarReminder(card, settings.daysBefore)}>
                    📅 ADD TO CALENDAR
                  </button>
                  <button className="btn-danger" onClick={() => deleteCard(card.id)}>DELETE</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "#080b14", zIndex: 100, display: "flex", flexDirection: "column" }}>
          <div style={{ padding: "18px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid rgba(255,255,255,0.08)" }}>
            <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.5)", fontSize: 22, cursor: "pointer", padding: 4, lineHeight: 1 }}>✕</button>
            <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 15, fontWeight: 700, color: "#fff" }}>
              {editId ? "Edit Card" : "Add Card"}
            </div>
            <div style={{ width: 30 }} />
          </div>

          <div style={{ display: "flex", justifyContent: "center", gap: 8, padding: "16px 0 8px" }}>
            {[0, 1, 2].map(i => (
              <div key={i} style={{ width: i === step ? 22 : 8, height: 8, borderRadius: 4, background: i === step ? "#e8ff47" : i < step ? "rgba(232,255,71,0.4)" : "rgba(255,255,255,0.15)", transition: "all 0.2s" }} />
            ))}
          </div>

          <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "20px 28px", maxWidth: 480, width: "100%", margin: "0 auto" }}>

            {step === 0 && (
              <div>
                <div style={{ fontSize: 11, letterSpacing: 3, color: "#e8ff47", marginBottom: 8 }}>STEP 1 OF 3</div>
                <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 24, fontWeight: 800, color: "#fff", marginBottom: 24 }}>
                  What's this card called?
                </div>
                <input
                  className="input" autoFocus
                  style={{ fontSize: 18, padding: "16px 18px" }}
                  placeholder="e.g. HSBC Visa"
                  value={form.name}
                  onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                />
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginTop: 10 }}>A nickname you'll recognize — bank name is fine.</div>

                <div style={{ marginTop: 32 }}>
                  <div style={{ fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.4)", marginBottom: 10 }}>PICK A COLOR (OPTIONAL)</div>
                  <div style={{ display: "flex", gap: 10 }}>
                    {CARD_COLORS.map((c, i) => (
                      <div key={i} onClick={() => setForm(f => ({ ...f, colorIdx: i }))} style={{ width: 42, height: 30, borderRadius: 6, background: `linear-gradient(135deg, ${c.bg}, ${c.accent})`, cursor: "pointer", outline: form.colorIdx === i ? "2px solid #e8ff47" : "2px solid transparent", outlineOffset: 3 }} />
                    ))}
                  </div>
                </div>
              </div>
            )}

            {step === 1 && (
              <div>
                <div style={{ fontSize: 11, letterSpacing: 3, color: "#e8ff47", marginBottom: 8 }}>STEP 2 OF 3</div>
                <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 24, fontWeight: 800, color: "#fff", marginBottom: 6 }}>
                  What day is payment due?
                </div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginBottom: 28 }}>The day of the month, e.g. 15</div>

                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 20 }}>
                  <button
                    onClick={() => setForm(f => ({ ...f, dueDay: Math.max(1, (parseInt(f.dueDay) || 1) - 1) }))}
                    style={{ width: 52, height: 52, borderRadius: "50%", background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)", color: "#fff", fontSize: 24, cursor: "pointer" }}
                  >−</button>
                  <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 56, fontWeight: 800, color: "#e8ff47", minWidth: 100, textAlign: "center" }}>
                    {form.dueDay || "—"}
                  </div>
                  <button
                    onClick={() => setForm(f => ({ ...f, dueDay: Math.min(31, (parseInt(f.dueDay) || 0) + 1) }))}
                    style={{ width: 52, height: 52, borderRadius: "50%", background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)", color: "#fff", fontSize: 24, cursor: "pointer" }}
                  >+</button>
                </div>
                <input
                  type="range" min="1" max="31" value={form.dueDay || 1}
                  onChange={e => setForm(f => ({ ...f, dueDay: e.target.value }))}
                  style={{ width: "100%", marginTop: 28, accentColor: "#e8ff47" }}
                />
              </div>
            )}

            {step === 2 && (
              <div>
                <div style={{ fontSize: 11, letterSpacing: 3, color: "#e8ff47", marginBottom: 8 }}>STEP 3 OF 3</div>
                <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 24, fontWeight: 800, color: "#fff", marginBottom: 6 }}>
                  A few extra details
                </div>
                <div style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", marginBottom: 24 }}>All optional — skip anything you don't know</div>

                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  <div>
                    <div style={{ fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.5)", marginBottom: 6 }}>LAST 4 DIGITS</div>
                    <input className="input" placeholder="1234" maxLength={4} value={form.last4} onChange={e => setForm(f => ({ ...f, last4: e.target.value.replace(/\D/g, "") }))} />
                  </div>
                  <div>
                    <div style={{ fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.5)", marginBottom: 6 }}>MINIMUM PAYMENT ($)</div>
                    <input className="input" type="number" placeholder="0.00" value={form.minPayment} onChange={e => setForm(f => ({ ...f, minPayment: e.target.value }))} />
                  </div>
                  <div>
                    <div style={{ fontSize: 11, letterSpacing: 2, color: "rgba(255,255,255,0.5)", marginBottom: 6 }}>CURRENT BALANCE ($)</div>
                    <input className="input" type="number" placeholder="0.00" value={form.balance} onChange={e => setForm(f => ({ ...f, balance: e.target.value }))} />
                  </div>
                </div>
              </div>
            )}
          </div>

          <div style={{ padding: "16px 28px 28px", display: "flex", gap: 12, maxWidth: 480, width: "100%", margin: "0 auto" }}>
            {step > 0 && (
              <button className="btn-ghost" style={{ flex: 1, padding: "14px", fontSize: 13 }} onClick={() => setStep(s => s - 1)}>BACK</button>
            )}
            {step < 2 && (
              <button
                className="btn-primary"
                style={{ flex: 2, padding: "14px" }}
                disabled={step === 0 && !form.name.trim()}
                onClick={() => setStep(s => s + 1)}
              >
                CONTINUE
              </button>
            )}
            {step === 2 && (
              <button className="btn-primary" style={{ flex: 2, padding: "14px" }} onClick={handleSubmit} disabled={!form.dueDay}>
                {editId ? "SAVE CHANGES" : "ADD CARD"}
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
